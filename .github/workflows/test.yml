name: Test

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'src/**'
      - '.github/workflows/**'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        db_type: [mock, mongodb]
    env:
      MONGODB_URI: "mongodb://localhost:27017"
      PORT: "3002"
      DB_TYPE: ${{ matrix.db_type }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Set up MongoDB
        if: matrix.db_type == 'mongodb'
        uses: supercharge/mongodb-github-action@1.12.0

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: go test -v -count=1 ./src/tests/e2e/... 