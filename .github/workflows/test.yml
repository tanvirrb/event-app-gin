name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    env:
      MONGODB_URI: "mongodb://localhost:27017"
      PORT: "3002"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.24'

      - name: Set up MongoDB
        uses: supercharge/mongodb-github-action@1.12.0

      - name: Check MongoDB connection
        run: |
          mongosh --eval "db.runCommand({ ping: 1 })"
          echo "MongoDB connection string: $MONGODB_URI"
          echo "Server port: $PORT"

      - name: Get dependencies
        run: go mod download

      - name: Run tests
        run: |
          echo "Running tests with MONGODB_URI: $MONGODB_URI and PORT: $PORT"
          go test -v -count=1 ./src/tests/e2e/... 