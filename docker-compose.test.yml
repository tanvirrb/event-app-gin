services:
  mongodb:
    image: mongo:latest
    ports:
      - "27017:27017"
    command: ["mongod", "--quiet", "--logpath", "/dev/null"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 10s
      retries: 5

  test:
    build:
      context: .
      dockerfile: Dockerfile.test
    environment:
      - MONGODB_URI=mongodb://mongodb:27017
    volumes:
      - .:/app
    depends_on:
      mongodb:
        condition: service_healthy 