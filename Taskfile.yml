# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  default:
    cmds:
      - echo "{{.GREETING}}"
    silent: true
  lint:
    cmds:
      - golangci-lint run
    silent: false
  format:
    cmds:
      - golangci-lint fmt
    silent: false
  test:
    cmds:
      - go test -v ./src/tests/e2e/...
    silent: false
  docker-test:
    cmds:
      - docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit && docker-compose -f docker-compose.test.yml down
    silent: false
