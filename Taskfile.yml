# https://taskfile.dev

version: '3'

vars:
  GREETING: Hello, World!

tasks:
  lint:
    cmds:
      - golangci-lint run
    silent: false
  format:
    cmds:
      - golangci-lint fmt
    silent: false
  docker-test:
    cmds:
      - docker-compose -f docker-compose.test.yml up --build --abort-on-container-exit && docker-compose -f docker-compose.test.yml down
    silent: false
  docker-test-down:
    cmds:
      - docker-compose -f docker-compose.test.yml down
    silent: false
